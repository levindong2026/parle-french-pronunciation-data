- "@context": https://schema.org/
  type: LearningResource
  creativeWorkStatus: Published
  id: https://getparle.app/ressources-pedagogiques-prononciation-francaise/#montreal-classroom-title
  name: "Activité A1 en binôme : prendre les transports à Montréal"
  description: >-
    Activité complémentaire de 12 minutes pour un groupe débutant de français
    langue étrangère, utilisable notamment dans un cours universitaire
    d'initiation. Les apprenants repèrent deux règles dans le guide public de
    la Société de transport de Montréal, puis justifient une réponse orale en
    binôme. La fiche, les cartes individuelles, le corrigé et la version
    modifiable pour l'enseignant (DOCX) sont publiés par Parle sous licence
    CC BY 4.0. Le guide de la STM est une publication distincte.
  inLanguage: fr
  license: https://creativecommons.org/licenses/by/4.0/
  creator:
    - type: Organization
      name: Tingnova Inc.
  about:
    - https://w3id.org/kim/hochschulfaechersystematik/n059
  educationalLevel:
    - https://w3id.org/kim/educationalLevel/level_A
  learningResourceType:
    - https://w3id.org/kim/hcrt/worksheet
    - https://w3id.org/kim/hcrt/lesson_plan
  keywords:
    - français langue étrangère
    - français A1
    - compréhension écrite
    - interaction orale
    - transports à Montréal
  hasPart:
