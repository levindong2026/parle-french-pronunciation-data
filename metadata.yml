      name: Fiche d'activité et cartes (PDF)
    - id: https://getparle.app/montreal-transit-a1-corrige-fr.pdf
      name: Corrigé et déroulement (PDF)
    - id: https://getparle.app/montreal-transit-a1-carte-a-fr.pdf
      name: "Carte A : le bus 45 (PDF)"
    - id: https://getparle.app/montreal-transit-a1-carte-b-fr.pdf
      name: "Carte B : l'heure d'arrivée (PDF)"
    - id: https://getparle.app/montreal-transit-a1-enseignant-fr.docx
      name: Version modifiable pour l'enseignant (DOCX)
